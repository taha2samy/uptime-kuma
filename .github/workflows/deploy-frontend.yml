name: Deploy Frontend (Uptime Kuma)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: BuiStepld Simulation
        run: echo "Building Frontend... (Using Pre-built Docker Image)"

      # 3. Copy docker-compose.yml to Server
      - name: Copy Compose File
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/home/ubuntu/frontend/"

      # 4. Deploy (SSH & Run Docker)
      - name: Execute Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Starting Deployment..."
            cd /home/ubuntu/frontend
            
            # Ensure Docker is running
            sudo systemctl start docker
            
            # Pull latest image and recreate containers
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            
            echo "✅ Deployment Successful!"